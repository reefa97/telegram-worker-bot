<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reefa">
  <title>Reefa — Panel</title>
  <script>
    /* Set theme before paint to avoid FOUC. Match raw hex values to
       tokens defined in src/index.css (--bg-app). */
    (function() {
      var t = localStorage.getItem('theme');
      var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var html = document.documentElement;
      if (isDark) {
        html.classList.add('dark');
        html.style.backgroundColor = '#0a0a0a';
        html.style.colorScheme = 'dark';
      } else {
        html.style.backgroundColor = '#ffffff';
        html.style.colorScheme = 'light';
      }
    })();
  </script>
  <style>body { background-color: inherit; }</style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
